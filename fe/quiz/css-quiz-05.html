<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .box-1 {
            width: 500px;
            margin: 0 auto;
            margin-top: 50px;
        

        }

        .box {
            width: 250px;
            height: 100px;
        }

        .red-box {

            background-color: red;

            display: inline-block;
            /* position: relative; */
        }

        .green-box {
            background-color: green;
            display: inline-block;

        }

        .blue-box {
            width: 500px;
            height: 200px;
            background-color: blue;

        }

        .p1 {
            margin: 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box-1">
        <div class="box red-box"></div><div class="box green-box"></div>
        <p class="p1">글자가운데정렬</p>
        <div class="blue-box"></div>
    </div>
</body>

</html>
