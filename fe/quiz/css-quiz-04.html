<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar {
            margin: 0;
            height: 50px;
            background-color: lightgray;
            position: sticky;
            top: 0px;
            font-size: large;
        }

        .box {width: 100px;
            height: 100px;}

        .red-box {

            background-color: red;
            

            position: relative;
            /* z-index: n값; = 보여지는 화면을 앞으로 빼는 값 */
        }

        .green-box {
            background-color: green;
          
            left: 100px;
            top: 150px;
            position: fixed;
            z-index: 1;

        }

        .yellow-box {
            background-color: yellow;
            

            position: relative;

        }

        .container {
            width: 500px;
            height: 300px;
            left: 50px;
            top: 100px;
            border: 4px solid black;
            position: fixed;
        }
    </style>
</head>

<body>
    <div class="navbar">배경색이 lightgray <br>h3글자</div>

    <div class="container">

        <div class="box red-box">A</div>
        <div class="box green-box">B</div>
        <div class="box yellow-box">C</div>
    </div>

</body>

</html>
