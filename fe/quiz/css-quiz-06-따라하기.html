<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        .contaner {
            background-color: blanchedalmond;
            width: 800px;
            /* height: 500px; */
            margin: auto;
        }

        .header {
            display: flex;
        }

        .header-left {
            background-color: yellow;
            /* width: 400px; */
            width: 50%;
            height: 100px;
        }

        .header-right {
            background-color: gray;
            width: 400px;
            height: 100px;
        }

        .nav {
            background-color: purple;
            width: 100%;
            height: 100px;
        }

        .main {
            display: flex;
        }

        .main-left {
            background-color: coral;
            width: 40%;
            height: 200px;
        }

        .main-right {
            background-color: aqua;
            width: 60%;
            height: 200px;
        }

        .main-right-1 {
            background-color: yellow;
            height: 100px;
        }

        .main-right-2 {
            background-color: darkolivegreen;
            height: 100px;
        }


        .footer {
            display: flex;
        }


        .footer-1 {
            background-color: rgb(206, 34, 34);
            width: 25%;
            height: 100px;
        }

        .footer-2 {
            background-color: rgb(9, 168, 173);
            width: 25%;
            height: 100px;
        }

        .footer-3 {
            background-color: rgb(211, 167, 24);
            width: 25%;
            height: 100px;
        }

        .footer-4 {
            background-color: rgb(201, 23, 142);
            width: 25%;
            height: 100px;
        }
    </style>

</head>

<body>
    <div class="contaner">

        <div class="header">
            <div class="header-left"></div>
            <div class="header-right"></div>
        </div>
        <div class="nav"></div>

        <div class="main">
            <div class="main-left"></div>
            <div class="main-right">
                <div class="main-right-1"></div>
                <div class="main-right-2"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-1"></div>
            <div class="footer-2"></div>
            <div class="footer-3"></div>
            <div class="footer-4"></div>
        </div>

    </div>
</body>


</html>
