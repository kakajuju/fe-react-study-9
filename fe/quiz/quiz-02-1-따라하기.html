<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        고객명 : <input type="text"><br><br>
        전화번호 : <input type="tel"><br><br>
        이메일 : <input type="email"><br><br>

        <br><br>

        피자선택 : <select>
            <option disabled selected>피자를 선택하세요.</option>
            <option>치즈</option>
            <option>페페로니</option>
            <option>콤비네이션</option>
        </select>

        <fieldset>
            <legend>피자 사이즈</legend>
            <label><input type="radio" name="pz_size"> small</label> <br><br>
            <label><input type="radio" name="pz_size"> medium</label> <br><br>
            <label><input type="radio" name="pz_size"> large</label> <br><br>
        </fieldset>

        <fieldset>
            <legend>토핑 선택</legend>
            <label><input type="checkbox"> 베이컨</label> <br><br>
            <label><input type="checkbox"> 치즈</label> <br><br>
            <label><input type="checkbox"> 양파</label> <br><br>
            <label><input type="checkbox"> 버섯</label> <br><br>
        </fieldset>

        <fieldset>
            <legend>음료</legend>
            <label><input type="radio" name="ju"> 콜라</label> <br><br>
            <label><input type="radio" name="ju"> 사이다</label> <br><br>
            <label><input type="radio" name="ju"> 환타</label> <br><br>
        </fieldset>

        희망배송시간 : <input type="time"><br><br>
        배송시 요청사항 : <textarea></textarea><br><br>

        <!-- <input type="submit" value="주문하기"> -->
        <button type="submit">주문하기</button>

        <!-- <button>주문하기</button>
        <input type="button" value="주문하기"> -->
    </form>
</body>
</html>
