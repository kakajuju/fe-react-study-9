<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
            

        }

        .box1 {
            width: 800px;
            display: flex;
            
        }

        .blue {
            background-color: blue;
            width: 400px;
            height: 100px;

        }

        .red {
            background-color: red;
            width: 400px;
            height: 100px;
            display: flex;

        }

        .purple {
            background-color: purple;
            width: 800px;
            height: 100px;
            display: flex;
        }

        .box1-1 {
            width: 800px;
            display: flex;
        }

        .green {
            background-color: green;
            width: 300px;
            height: 200px;
        }




        .box1-2 {
            width: 800px;
            display: flex;
            justify-content: flex-end;


        }

        .orange {
            background-color: orange;
            width: 500px;
            height: 100px;
            display: flex;
        }

        .aqua {
            background-color: aqua;
            width: 500px;
            height: 100px;
            display: flex;
            justify-content: flex-end;

        }

        .box2 {
            width: 800px;
            display: flex;
        }

        .blueviolet {
            background-color: blueviolet;
            height: 100px;
            width: 50%;
        }

        .pink {
            background-color: pink;
            height: 100px;
            width: 50%;
        }

        .brown {
            background-color: brown;
            height: 100px;
            width: 50%;
        }

        .aquamarine {
            background-color: aquamarine;
            height: 100px;
            width: 50%;
        }
    </style>
</head>

<body>
    <div class="box1">
        <div class="blue"></div>
        <div class="red"></div>
    </div>
    <div class="purple"></div>
    <div class="box1-1">
        <div class="box1-2">
            <div class="green"></div>

            <div class="box1-3">
                <div class="orange"></div>
                <div class="aqua"></div>
            </div>
        </div>
    </div>

    <div class="box2">
        <div class="blueviolet"></div>
        <div class="pink"></div>
        <div class="brown"></div>
        <div class="aquamarine"></div>
    </div>


    </div>
</body>

</html>
