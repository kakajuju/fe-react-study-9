<!DOCTYPE html>
<html lang="ko">

<title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .item {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .container {
            display: flex;
            /* flex-direction: column-reverse; */
            flex-direction: row;
            flex-wrap: wrap;

            /* flex-flow: row, wrap; */

            /* 주축 정렬 */
            justify-content: space-between;

            /* 교차축 정렬 */
            /* align-items: center; */ /* 아이템별로 센터 정렬 */
            align-content: center; /* 컨텐츠 전체를 묶어서 센터 정렬 */

            height: 400px;
            background-color: lightblue;
        }

        .content-center {
            /* text-align: center;
            padding-top: 35px; */

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

    </head>

    <body>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item content-center">3</div>
            <div class="item">4</div>
            <div class="item content-center">5</div>
            <div class="item content-center">6</div>
        </div>
    </body>

</html>
