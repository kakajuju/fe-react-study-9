<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        /* 기본 베이스 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            border: 2px solid blue;
            padding: 15px;
            margin: 30px;
        }

        .box2 {
            margin: 50px;
            padding-left: 100px;
            padding-right: 25px;


            /* border : 3px dashed red; */

            border-width: 4px;
            border-style: dashed;
            border-color: red;

            width: 200px;
            height: 150px;

            /* box-sizing: border-box; border-box, content-box, padding-box */
            /* box-sizing: content-box; border-box, content-box, padding-box */
            /* box-shadow: 10px 10px 5px gray; x축, y축, blur, color */
        }
    </style>
</head>

<body>

    <div class="box1">box1</div>

    <div class="box2">box2</div>

    <p>다른 요소 p태그</p>

</body>

</html>
