<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>


        .box {
            width: 200px;
            height: 200px;
        }

        .red-box {

            background-color: red;
            left: 100px;
            position: relative;
            z-index: 500;
            /* z-index: n값; = 보여지는 화면을 앞으로 빼는 값 */
        }

        /* 레드박스와 left가 같은데 위치가 다른 이유는 그린박스는 마진을 무시하기 때문이다. */
        .green-box {
            background-color: green;
            left: 100px;
            top: 50px;
            position: absolute;
            z-index: 10;

        }

        .blue-box {
            background-color: blue;

            left: 50px;
            top: -30px;
            position: relative;

        }

        .container {
            background-color: lightgray;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>

    <br><br>

    <div class="container">

        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
    </div>

</body>

</html>
